---
# Full bring-up: rke2_common everywhere -> rke2_server one CP at a time
# -> rke2_agent across all workers. The serial: 1 on the server play is
# load-bearing -- it gates cluster-init to a single bootstrap host and
# lets the other CPs probe the LB and join cleanly.

- name: OS prereqs on every host
  hosts: all
  gather_facts: true
  roles:
    - rke2_common

- name: RKE2 server (control plane)
  hosts: rke2_servers
  gather_facts: false
  serial: 1
  roles:
    - rke2_server

- name: RKE2 agent (workers)
  hosts: rke2_agents
  # gather_facts true on workers so longhorn_disk_prep can use
  # `inventory_hostname` for kubectl node-label/annotate. (Cheap on the
  # 3 workers; the server play above stays gather_facts:false to keep
  # serial:1 bring-up snappy.)
  gather_facts: true
  roles:
    # longhorn_disk_prep mkfs's + mounts the dedicated DO Block Storage
    # volume at /var/lib/longhorn BEFORE rke2_agent starts, then labels
    # + annotates the node for Longhorn's opt-in default-disk pattern
    # AFTER rke2_agent has registered the node (gating inside the role).
    # See ansible/roles/longhorn_disk_prep/README.md.
    - longhorn_disk_prep
    - rke2_agent
