---
# Full bring-up: rke2_common everywhere -> rke2_server one CP at a time
# -> rke2_agent across all workers. The serial: 1 on the server play is
# load-bearing -- it gates cluster-init to a single bootstrap host and
# lets the other CPs probe the LB and join cleanly.

- name: OS prereqs on every host
  hosts: all
  gather_facts: true
  roles:
    - rke2_common

- name: RKE2 server (control plane)
  hosts: rke2_servers
  gather_facts: false
  serial: 1
  roles:
    - rke2_server

- name: RKE2 agent (workers)
  hosts: rke2_agents
  # gather_facts true on workers so the Longhorn roles can use
  # `inventory_hostname` for kubectl node-label/annotate. (Cheap on the
  # 3 workers; the server play above stays gather_facts:false to keep
  # serial:1 bring-up snappy.)
  gather_facts: true
  roles:
    # 1. longhorn_disk_prep mkfs's + mounts the dedicated DO Block
    #    Storage volume at /var/lib/longhorn. Runs BEFORE rke2_agent.
    # 2. rke2_agent installs + starts the agent (which creates
    #    /var/lib/rancher/rke2/bin/kubectl and registers the Node).
    # 3. longhorn_node_register labels + annotates the registered Node
    #    so Longhorn opts in to creating a default disk at
    #    /var/lib/longhorn (and nowhere else). Runs AFTER rke2_agent
    #    because it requires the worker-local kubectl binary.
    # See ansible/roles/longhorn_disk_prep/README.md and
    # ansible/roles/longhorn_node_register/README.md.
    - longhorn_disk_prep
    - rke2_agent
    - longhorn_node_register
