[defaults]
inventory             = inventory/generated.yaml
roles_path            = roles
collections_path      = ~/.ansible/collections:./.galaxy-cache
retry_files_enabled   = False
stdout_callback       = ansible.builtin.default
result_format         = yaml
bin_ansible_callbacks = True
# SOPS-encrypted group_vars (secrets.enc.yaml) decrypt automatically via the
# community.sops vars plugin. Order matters: host_group_vars first so plain
# group_vars/all/main.yml loads, then sops decrypts secrets.enc.yaml on top.
vars_plugins_enabled  = host_group_vars,community.sops.sops

# Cloud-init created the droplets with ed25519 host keys at first boot. We
# accept those on first connect via -o StrictHostKeyChecking=accept-new in
# ssh_args (below). This is NOT the same as host_key_checking=False — once
# accepted, subsequent connections still verify the recorded fingerprint.
host_key_checking     = True

# Treat warnings the operator can act on as warnings, not noise.
deprecation_warnings  = True

[ssh_connection]
# Pipelining is a big throughput win once sudo doesn't require a tty.
pipelining            = True
ssh_args              = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts.rke2demo
control_path          = ~/.ansible/cp/%%h-%%p-%%r

[inventory]
enable_plugins        = yaml,ini

# Tell community.sops.sops to recognize our `.enc.*` naming convention (the
# default is `.sops.*`). Keeps the encrypted secrets under the same suffix
# pattern used by Tofu, Kubernetes manifests, and the SOPS-runbook docs.
[community.sops]
# Broadened from `.enc.*` to plain `.yml,.yaml,.json` so the renamed
# `secrets.yaml` (devopscoop/fluxcd-template convention) is picked up by
# the vars plugin. `handle_unencrypted_files = skip` means non-encrypted
# .yaml files in group_vars (like main.yml) are silently passed to the
# `host_group_vars` plugin instead of erroring -- requires SOPS 3.9.0+.
valid_extensions         = .yaml,.yml,.json
handle_unencrypted_files = skip
