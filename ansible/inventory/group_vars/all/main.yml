---
# Non-secret defaults applied to every host.
# Tokens and other secrets live in secrets.yaml (SOPS-encrypted) under
# the devopscoop/fluxcd-template convention.

# Cluster identity. Used for the kubeconfig path, drives Tofu resource
# naming via `project_name`, and feeds Flux configuration. Encodes
# provider + region + role (`do-nyc3-rke2-demo` = DigitalOcean / nyc3 /
# rke2-demo). Phase 4 bare-metal will pick something following the same
# convention (e.g. `bm-onprem-rke2-prod`).
cluster_name: do-nyc3-rke2-demo

# RKE2 release. Pinned to the current stable channel as of 2026-05-14.
# Update by checking https://update.rke2.io/v1-release/channels (stable).
rke2_version: "v1.35.4+rke2r1"
rke2_channel: "stable"

# RKE2 addons to skip. FluxCD installs ingress in Phase 3, so we don't
# want RKE2's bundled rke2-ingress-nginx running here.
rke2_disable:
  - rke2-ingress-nginx

# tls-san list assembled at templating time from cp_endpoint (LB IP),
# all CP private IPs, and all CP public IPs. The RKE2 apiserver cert
# is reissued every config change, so updates to this list take effect
# on rke2-server restart.
#
# rke2_extra_tls_sans is a hook for adding stable DNS names later
# (e.g. rke2.example.com) without touching the role.
rke2_extra_tls_sans: []

# Port numbers as named constants so the same values can be referenced
# from Tofu firewall rules and Ansible config templates without drift.
# These are RKE2 defaults; do not change unless you also change them
# in the DO firewall module.
rke2_supervisor_port: 9345
kube_apiserver_port: 6443
kubelet_port:        10250

# Where on the operator workstation to deposit the rewritten kubeconfig
# after the first CP comes up. Lives under the operator's home `~/.kube/`
# -- OUTSIDE the repo working tree -- so a kubeconfig (a cluster-admin
# credential) cannot accidentally land in a commit. Matches the convention
# `devopscoop/fluxcd-template`'s deploy.sh hardcodes
# (KUBECONFIG="${HOME}/.kube/${cluster_name}") so Phase 3 bootstrap
# reuses the same file.
operator_kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/{{ cluster_name }}"

# Override RKE2's default cluster (pod) and service CIDRs. The defaults are
# 10.42.0.0/16 and 10.43.0.0/16 respectively, which overlap the do-test
# VPC at 10.42.0.0/20 -- the CNI's pod-network routes shadow the VPC routes
# inside the kernel routing table and inter-droplet VPC traffic breaks with
# `RTNETLINK answers: Invalid argument`. Pinning to 10.244.0.0/16 / 10.245.0.0/16
# keeps both ranges well clear of the VPC. We can't simply move the VPC --
# DO's per-region "default VPC" rule blocks deletion and demotion of our VPC.
rke2_cluster_cidr: "10.244.0.0/16"
rke2_service_cidr: "10.245.0.0/16"

# Network interface for Canal/Flannel's VXLAN tunnel. Must be the interface
# that holds the node's VPC private IP -- the cluster firewall allows UDP/8472
# (Flannel VXLAN) only from VPC sources, so binding to the public NIC would
# get cross-node pod traffic dropped at the firewall.
#
# DO droplets in a VPC use `eth1` (eth0 = public, eth1 = VPC). Bare-metal
# Phase 4 will need to override this to whatever the host's VPC-equivalent
# interface is named (likely `bond0` or similar).
rke2_canal_flannel_iface: eth1

# Extra kubelet flags rendered into /etc/rancher/rke2/config.yaml's
# `kubelet-arg:` list on every node (server + agent). Empty by default.
#
# install-do-ccm adds `cloud-provider=external` so the DigitalOcean
# Cloud Controller Manager can untaint nodes (kubelet adds the
# `node.cloudprovider.kubernetes.io/uninitialized` taint at startup
# when this flag is set AND when no internal cloud-provider is
# initializing the node first; CCM removes it after initializing).
#
# This kubelet flag pairs with `rke2_cloud_provider_name: external`
# below -- both are required. See openspec/changes/install-do-ccm/.
#
# Phase 4 bare-metal removes CCM and reverts this to `[]` (or whatever
# the bare-metal load-balancer integration needs).
rke2_kubelet_args:
  - "cloud-provider=external"

# RKE2-level cloud-provider setting, rendered into config.yaml as
# `cloud-provider-name: <value>`. Empty disables the line entirely.
#
# `external` tells RKE2 NOT to set its own providerID at node-join,
# leaving the field empty for DO CCM to populate with
# digitalocean://<droplet-id>. Without this (the v2 install-do-ccm
# mistake), RKE2 sets providerID=rke2://<name> -- which is immutable
# in Kubernetes once set -- and DO CCM rejects every node with
# `provider ID "rke2://..." is missing prefix "digitalocean://"`.
# Service-LB provisioning then never happens. Confirmed empirically
# during the 2026-05-17 unattended test of feat/install-do-ccm.
#
# WARNING: providerID is immutable, so changing this knob's value
# requires a full `make destroy` + fresh bring-up for it to take effect
# on a cluster that has already joined nodes. Per-node delete + rejoin
# is theoretically possible but risks etcd quorum loss on the CPs.
#
# Phase 4 bare-metal sets this to "" so RKE2 stays in charge.
rke2_cloud_provider_name: "external"
