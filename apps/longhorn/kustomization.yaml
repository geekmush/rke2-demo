# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-configmaps-generated-with-kustomize
#
# Revision 2 cleanup (enable-longhorn proposal v2):
# - Dropped `evanstest.secrets.yaml` (upstream's S3 backup creds) and
#   `longhorn-crypto.secrets.yaml` (upstream's per-volume crypto key);
#   both were SOPS-encrypted with the upstream template author's age key,
#   unreadable to us. The vendored files have been deleted from disk.
# - Dropped `longhorn-crypto-global.sc.yaml` -- the encrypted StorageClass
#   depended on the deleted `longhorn-crypto` Secret and would have left
#   any PVC using it stuck Pending. Reintroduce in a separate future
#   change when encryption-at-rest becomes a real requirement.
# - Dropped the `secretGenerator:` block entirely -- the vendored template
#   referenced a `helm_secrets.yaml` that didn't exist on disk, which made
#   `kustomize build` fail. We have no Helm-values secrets for Longhorn at
#   this phase; no replacement file is needed.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: longhorn-system

resources:
  - release.yaml
configMapGenerator:
  - name: longhorn-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
