---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: longhorn-system
  labels:
    # https://longhorn.io/docs/1.9.0/advanced-resources/os-distro-specific/talos-linux-support/#pod-security
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 60m
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      # 1.11.2 is the latest stable as of 2026-05-17. v1.12 is RC-only.
      # v1.11 GA'd parallel replica rebuild + other improvements over 1.10.
      # See enable-longhorn proposal v2 "Pre-flight findings" #3 for the
      # version-bump rationale.
      version: 1.11.2
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: longhorn-values
  # Note: no `Secret longhorn-secrets` valuesFrom -- the vendored template's
  # secretGenerator pointing at a missing helm_secrets.yaml was dropped in
  # apps/longhorn/kustomization.yaml during the enable-longhorn cleanup.
  # No Helm-values secrets at this phase.
