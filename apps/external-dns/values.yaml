# dyff between <(yq . <(helm show values external-dns/external-dns --version v1.20.0)) <(yq eval '. * load("values.yaml")' <(helm show values external-dns/external-dns --version v1.20.0))
# vim -O <(helm show values external-dns/external-dns --version v1.20.0) values.yaml

# Poll interval. Chart default is 1m. The upstream template's example sets
# this to 10m to avoid Route 53 rate limits in larger environments, but we
# only manage one zone at DigitalOcean (escapekey.org), and DO's DNS API
# rate limits are generous (5000 req/hr per token, shared with Tofu + CCM
# + cert-manager but easily within budget for a 1-minute external-dns poll).
#
# Why aggressive polling matters here: test #4 (2026-05-17) found that
# external-dns can leave orphan TXT registry markers at DO when an Ingress
# is recreated mid-cycle (Service deleted + recreated to swap LB type).
# The orphan TXT persists until the next reconcile detects + cleans it.
# At 10m interval that's a 10-minute window where the corresponding A
# record can't be recreated. At 1m the window shrinks to one polling
# cycle, mostly self-healing within typical operator-observation time.
# This does NOT fix the underlying chart bug (issue #44) -- it just
# reduces the window where it bites.
interval: 1m

# If we have a larger interval, we don't want to wait for external-dns to make changes. Uncomment this if needed.
triggerLoopOnEvent: true

# We want to delete records for ingresses that have been deleted.
policy: sync

# If we have multiple k8s clusters writing to the same DNS zone, each external-dns needs a way to identify the records it owns. And since we can only have one external-dns provider per cluster, the setting this to the cluster name seems reasonable.
txtOwnerId: do-nyc3-rke2-demo

# Scope external-dns to the zones it should actually manage. Without this,
# external-dns enumerates every zone the DO PAT can see and would claim
# ownership of any future zone added to the account. The PAT is full-access
# (shared with Tofu), so this filter is the only safeguard. Add new zones
# here intentionally as the account grows. See docs/runbooks/dns-migration-to-do.md.
domainFilters:
  - escapekey.org

# DigitalOcean config based on:
# https://github.com/kubernetes-sigs/external-dns/blob/master/docs/tutorials/digitalocean.md
# DO is a built-in external-dns provider, not a webhook-based one. The chart
# accepts the provider as either a string (`provider: digitalocean`) or an
# object (`provider: { name: digitalocean }`); the string form is sufficient
# in chart 1.20.0+.
provider:
  name: digitalocean
env:
  - name: DO_TOKEN
    valueFrom:
      secretKeyRef:
        name: digitalocean-dns
        key: access-token

resources:
  requests:
    cpu: 32m
    memory: 100Mi
  limits:
    # Can't explicitly set this to null, because the helm chart is a little overengineered...
    # "resources.limits.cpu: Invalid type. Expected: string, given: null"
    memory: 100Mi
