apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: cert-manager

resources:
  - digitalocean-dns.secrets.yaml
  - clusterissuer.yaml             # letsencrypt (ACME, DNS-01 via DO; blocked on DNS propagation)
  - selfsigned-clusterissuer.yaml  # in-memory CA; no external deps; cluster-internal use
