# https://cert-manager.io/docs/configuration/acme/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: hostmaster@escapekey.org

    # Default profile is "classic", but cert-manager docs uses tlsserver, which reflects "the latest recommendations from the CA/Browser Forum Baseline Requirements, as well as general trends within the WebPKI community."
    # https://cert-manager.io/docs/configuration/acme/#acme-certificate-profiles
    # https://letsencrypt.org/docs/profiles/#tlsserver
    profile: tlsserver

    # Let's Encrypt's prod server
    # https://letsencrypt.org/getting-started/#selecting-and-operating-an-acme-client-yourself
    server: https://acme-v02.api.letsencrypt.org/directory

    # This is supposed to have a default of "tls.key", but apparently that doesn't work, because I get this error when I don't specify it:
    #
    # $ k get ks -n flux-system cert-manager-custom-resources
    # NAME                            AGE   READY   STATUS
    # cert-manager-custom-resources   64m   False   ClusterIssuer/cert-manager/letsencrypt dry-run failed (Invalid): ClusterIssuer.cert-manager.io "letsencrypt" is invalid: spec.acme.privateKeySecretRef: Required value...
    #
    # https://github.com/cert-manager/cert-manager/issues/7845
    privateKeySecretRef:
      name: tls.key

    solvers:

      # DNS-01 via DigitalOcean DNS. Primary solver -- works regardless of
      # whether the cluster has public ingress reachability. The token Secret
      # is provisioned by apps/cert-manager-custom-resources/digitalocean-dns.secrets.yaml.
      # https://cert-manager.io/docs/configuration/acme/dns01/digitalocean/
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token

      # HTTP-01 fallback via ingress-nginx. Useful for cluster-internal apps
      # served through the ingress; cert-manager picks the solver based on
      # which one matches the certificate's domain.
      - http01:
          ingress:
            ingressClassName: nginx

      # Future: envoy gateway. Uncomment if/when Gateway API lands in this cluster.
      # https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/#using-the-acme-issuer-with-lets-encrypt-and-http-01
      # - http01:
      #     gatewayHTTPRoute:
      #       parentRefs:
      #       - kind: Gateway
      #         name: eg
      #         namespace: envoy-gateway-system

# Staging Let's Encrypt. Same shape as `letsencrypt` above, but points at the
# staging ACME endpoint. Use it for repeated test/canary runs that would
# otherwise burn LE production's 5-certs-per-identifier-per-week quota --
# tests #2..#7 (2026-05-17) cumulatively exhausted that quota for
# canary.escapekey.org, blocking validation for ~10 hours until the window
# rolled. Staging has effectively unlimited quotas.
#
# Switching an Ingress to staging is one annotation flip:
#   cert-manager.io/cluster-issuer: letsencrypt-staging   # was: letsencrypt
#
# Caveat: staging certs are signed by "Fake LE Intermediate" -- NOT a public
# trust root, so browsers + `curl` (without -k) reject them. Use staging for
# the cert-issuance smoke test (cert-manager exercises end-to-end identically
# to prod), then switch back to `letsencrypt` for any cert that needs real
# trust. See issue #52.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: hostmaster@escapekey.org

    # Same profile as prod for behavioural parity.
    profile: tlsserver

    # Let's Encrypt's STAGING server. Issues certs from "Fake LE Intermediate"
    # -- not browser-trusted, but rate limits are effectively unlimited.
    # https://letsencrypt.org/docs/staging-environment/
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    # Distinct private-key Secret so staging + prod don't clobber each other.
    privateKeySecretRef:
      name: tls-staging.key

    # Same solvers as prod -- DNS-01 primary via DigitalOcean, HTTP-01
    # fallback via ingress-nginx. Reuses the same digitalocean-dns Secret.
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token
      - http01:
          ingress:
            ingressClassName: nginx
