# Self-signed ClusterIssuer.
#
# Purpose:
# - Phase 3b "cert-manager works end-to-end" verification, independent of
#   ACME (which is blocked on Dreamhost DNS delegation propagating).
# - Long-term: any cluster-internal TLS / mTLS that doesn't need a
#   publicly-trusted CA (dev/staging endpoints, service-to-service mTLS,
#   future ZTNA components).
#
# Used by issuing a Certificate with `issuerRef.name: selfsigned` and
# `issuerRef.kind: ClusterIssuer`. cert-manager generates an in-memory CA
# per Certificate, signs the leaf, and emits a Kubernetes Secret containing
# tls.crt + tls.key. No external dependencies.
#
# https://cert-manager.io/docs/configuration/selfsigned/

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
