# Vendored from digitalocean/digitalocean-cloud-controller-manager.
#
# Source:     https://raw.githubusercontent.com/digitalocean/digitalocean-cloud-controller-manager/master/releases/digitalocean-cloud-controller-manager/v0.1.67.yml
# Version:    v0.1.67
# Retrieved:  2026-05-16
#
# Do NOT hand-edit this file. To upgrade:
#   1. Check https://github.com/digitalocean/digitalocean-cloud-controller-manager/releases for the latest stable.
#   2. Verify Kubernetes-version compatibility in the CCM getting-started doc.
#   3. curl the new release manifest in place (overwrite this file's body, preserve this header).
#   4. Re-encrypt secrets if the chart structure changed (it usually doesn't).
#   5. PR + Flux reconcile.
#
# Any cluster-specific overrides belong in kustomization.yaml as `patches:`, not inline here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitalocean-cloud-controller-manager
  namespace: kube-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: digitalocean-cloud-controller-manager
  template:
    metadata:
      labels:
        app: digitalocean-cloud-controller-manager
    spec:
      dnsPolicy: Default
      hostNetwork: true
      serviceAccountName: cloud-controller-manager
      priorityClassName: system-cluster-critical
      tolerations:
        # this taint is set by all kubelets running `--cloud-provider=external`
        # so we should tolerate it to schedule the digitalocean ccm
        - key: "node.cloudprovider.kubernetes.io/uninitialized"
          value: "true"
          effect: "NoSchedule"
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        # cloud controller manages should be able to run on masters
        # TODO: remove this when ccm is not supported on k8s <= 1.23
        - key: "node-role.kubernetes.io/master"
          effect: NoSchedule
        # k8s clusters 1.24+ uses control-plane name instead of master
        - key: "node-role.kubernetes.io/control-plane"
          effect: NoSchedule
      containers:
      - image: digitalocean/digitalocean-cloud-controller-manager:v0.1.67
        name: digitalocean-cloud-controller-manager
        command:
          - "/bin/digitalocean-cloud-controller-manager"
          - "--leader-elect=false"
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
        env:
          - name: DO_ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: digitalocean
                key: access-token
---
apiVersion: v1
