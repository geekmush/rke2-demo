controller:

  # https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/configmap/
  config:

    # Snippets not working? You probably need to enable this.
    allow-snippet-annotations: "true"

    # This defaults to HTTP 503, but HTTP 429 (Too Many Requests) is the correct code, and it makes troubleshooting much clearer.
    limit-req-status-code: "429"

    # Uncomment this if you DGAF about security and you want to have variables in your redirect urls.
    # https://github.com/kubernetes/ingress-nginx/issues/11175
    # annotations-risk-level: Critical

  ingressClassResource:

    # Less lines of code is better, right? Set this as the default and we don't have to set this in every ingress in our cluster.
    default: true

  # Need at least 2 to be highly available.
  replicaCount: 2

  service:

    # DigitalOcean LB annotations consumed by digitalocean-cloud-controller-manager.
    # Full annotation reference:
    #   https://docs.digitalocean.com/products/kubernetes/how-to/add-load-balancers/#load-balancer-configuration
    annotations:

      # Force the classic public Load Balancer type. CCM v0.1.67+ defaults to
      # REGIONAL_NETWORK if this annotation is absent -- that's DO's newer
      # Network Load Balancer product whose IP is only routable from within
      # DigitalOcean's network, NOT the public internet. Test #3 on
      # 2026-05-17 hit this: the LB provisioned, cert+DNS worked, but
      # `curl` from outside DO timed out on TCP/443. See issue #35.
      #
      # Caveat: changing the type on an existing LB is not supported by the
      # DO API -- the existing Service must be kubectl-deleted and re-created
      # for CCM to provision a new LB of the new type. Inert if you're
      # standing the cluster up from scratch.
      service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL"

      # Predictable name in the DO Networking UI. CCM does NOT rename an
      # existing LB if this value changes -- it creates a new one and
      # orphans the old. Don't churn this annotation casually.
      service.beta.kubernetes.io/do-loadbalancer-name: "do-nyc3-rke2-demo-ingress"

      # Smallest LB tier (~$12/mo). Resize via this annotation is
      # non-destructive (no IP change). Bump if traffic outgrows it.
      service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"

      # tcp = L4 passthrough. ingress-nginx terminates TLS using
      # cert-manager-issued certs. http/https modes would terminate at
      # the DO LB using DO's certs -- incompatible with our cert-manager
      # flow. See openspec/changes/install-do-ccm/design.md.
      service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"

      # DO's built-in Let's Encrypt + DNS integration would race
      # cert-manager + external-dns. We own both -- disable DO's.
      service.beta.kubernetes.io/do-loadbalancer-disable-lets-encrypt-dns-records: "true"

    # Setting this to Local so we can see real client IPs in our logs - so we can see where our traffic is actually coming from.
    externalTrafficPolicy: "Local"

    # Template default was IPv6; do-nyc3-rke2-demo's cluster doesn't have IPv6
    # enabled. The HelmRelease fails with `Service "ingress-nginx-controller"
    # is invalid: spec.ipFamilies[0]: Invalid value: "IPv6": not configured
    # on this cluster` if IPv6 is requested here.
    ipFamilies:
    - IPv4

# Example of how to expose a TCP service
# tcp:
#   55001: "demo-bot/rabbitmq:5672"
